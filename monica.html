<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>💕 Para Mônica</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;
    overflow-x:hidden;overflow-y:auto;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }
  body{
    display:flex;align-items:center;justify-content:center;
    min-height:100dvh;min-height:100vh;
    transition:background .6s ease;
  }
  .bg-default{background:linear-gradient(160deg,#fce4ec 0%,#fff 60%,#f8bbd0 100%)}
  .bg-final{background:linear-gradient(160deg,#f06292 0%,#ec407a 50%,#e91e63 100%)}

  /* ── screens ── */
  .screen{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;
    transition:opacity .5s ease,transform .5s ease;
    transform:scale(.96);
    padding:20px;
    overflow-y:auto;
  }
  .screen.active{opacity:1;pointer-events:auto;transform:scale(1)}

  /* ── card ── */
  .card{
    background:#fff;border-radius:24px;
    box-shadow:0 8px 40px rgba(0,0,0,.10);
    width:100%;max-width:400px;
    padding:40px 28px;
    text-align:center;
    position:relative;
    z-index:10;
  }

  /* ── typography ── */
  .title{font-size:1.6rem;font-weight:700;color:#c2185b;margin-bottom:8px;line-height:1.3}
  .subtitle{font-size:1.1rem;color:#555;margin-bottom:28px;line-height:1.5}

  /* ── buttons ── */
  .btn{
    display:inline-block;
    padding:16px 40px;
    border:none;border-radius:60px;
    font-size:1.15rem;font-weight:700;
    cursor:pointer;
    transition:transform .15s ease,box-shadow .2s ease,background .2s ease;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    outline:none;
  }
  .btn:active{transform:scale(.93)!important}
  .btn-start{
    background:linear-gradient(135deg,#ec407a,#f06292);
    color:#fff;
    box-shadow:0 4px 18px rgba(236,64,122,.35);
    width:80%;max-width:280px;
  }
  .btn-yes{
    background:linear-gradient(135deg,#66bb6a,#43a047);
    color:#fff;
    box-shadow:0 4px 14px rgba(76,175,80,.30);
    min-width:120px;
    transition:transform .18s ease,box-shadow .2s ease,font-size .25s ease,padding .25s ease,min-width .25s ease;
  }
  .btn-no{
    background:#eee;color:#888;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    min-width:120px;
    position:relative;
    transition:transform .05s ease;
  }
  .btn-send{
    background:linear-gradient(135deg,#ec407a,#f06292);
    color:#fff;
    box-shadow:0 4px 18px rgba(236,64,122,.35);
    width:80%;max-width:280px;
    margin-top:16px;
  }
  .btn-row{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:8px}

  /* ── textarea ── */
  .textarea{
    width:100%;min-height:120px;
    border:2px solid #f8bbd0;border-radius:16px;
    padding:16px;font-size:1rem;
    font-family:inherit;resize:none;
    outline:none;
    transition:border-color .2s ease;
    color:#333;
  }
  .textarea:focus{border-color:#ec407a}

  /* ── replaced text ── */
  .replaced-text{
    background:#fce4ec;border-radius:16px;padding:20px;
    font-size:1.05rem;color:#c2185b;font-style:italic;
    line-height:1.6;
    opacity:0;transition:opacity .8s ease;
  }
  .replaced-text.show{opacity:1}

  /* ── final screen ── */
  .final-heart{font-size:5rem;animation:pulse 1s ease-in-out infinite}
  .final-text{font-size:1.5rem;font-weight:700;color:#fff;margin-top:16px;line-height:1.4;text-shadow:0 2px 8px rgba(0,0,0,.15)}

  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.18)}
  }

  /* ── floating hearts ── */
  .hearts-container{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .floating-heart{
    position:absolute;bottom:-60px;
    font-size:1.6rem;
    animation:floatUp linear forwards;
    opacity:0;
  }
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) rotate(0deg) scale(.6)}
    10%{opacity:1}
    90%{opacity:1}
    100%{opacity:0;transform:translateY(-110vh) rotate(45deg) scale(1.2)}
  }

  /* ── NO button absolute positioning on screen ── */
  .btn-no-floating{
    position:absolute;
    z-index:20;
    transition:none;
  }

  /* ── emoji decorations ── */
  .emoji-deco{font-size:2.4rem;margin-bottom:12px;display:block}

  /* ── screen shake micro-animation ── */
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
  }
  .shake{animation:shake .25s ease}
</style>
</head>
<body class="bg-default">

<!-- ═══════ TELA INICIAL ═══════ -->
<div class="screen active" id="screen-start">
  <div class="card">
    <span class="emoji-deco">📋</span>
    <h1 class="title" style="color:#444">Ei Mônica!</h1>
    <p class="subtitle">Preparei umas perguntinhas rápidas pra você.<br>Juro que é rapidinho! 😄</p>
    <button class="btn btn-start" onclick="goTo('screen-q1')">Começar</button>
  </div>
</div>

<!-- ═══════ PERGUNTA 1 ═══════ -->
<div class="screen" id="screen-q1">
  <div class="card" id="card-q1">
    <span class="emoji-deco">😍</span>
    <h1 class="title">Pergunta 1</h1>
    <p class="subtitle">Você acha o Henrique muito lindo?</p>
    <div class="btn-row">
      <button class="btn btn-yes" id="yes1" onclick="goTo('screen-q2')">SIM ✅</button>
      <button class="btn btn-no" id="no1" ontouchstart="runAway(1, event)" onmousedown="runAway(1, event)">NÃO ❌</button>
    </div>
  </div>
</div>

<!-- ═══════ PERGUNTA 2 ═══════ -->
<div class="screen" id="screen-q2">
  <div class="card" id="card-q2">
    <span class="emoji-deco">✍️</span>
    <h1 class="title">Pergunta 2</h1>
    <p class="subtitle">O que você acha do Henrique?</p>
    <div id="q2-input">
      <textarea class="textarea" id="userText" placeholder="Escreve o que você acha..."></textarea>
      <button class="btn btn-send" onclick="submitText()">Enviar 💬</button>
    </div>
    <div class="replaced-text" id="replacedText"></div>
  </div>
</div>

<!-- ═══════ PERGUNTA 3 ═══════ -->
<div class="screen" id="screen-q3">
  <div class="card" id="card-q3">
    <span class="emoji-deco">💘</span>
    <h1 class="title">Pergunta 3</h1>
    <p class="subtitle">Você daria uma chance pra ele?</p>
    <div class="btn-row">
      <button class="btn btn-yes" id="yes3" onclick="goTo('screen-final')">SIM ✅</button>
      <button class="btn btn-no" id="no3" ontouchstart="runAway(3, event)" onmousedown="runAway(3, event)">NÃO ❌</button>
    </div>
  </div>
</div>

<!-- ═══════ TELA FINAL ═══════ -->
<div class="screen" id="screen-final">
  <div class="card" style="background:rgba(255,255,255,.15);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25)">
    <div class="final-heart">❤️</div>
    <p class="final-text">Henrique é 100% match com você 💖</p>
  </div>
</div>

<div class="hearts-container" id="heartsContainer"></div>

<script>
(function(){
  'use strict';

  /* ── state ── */
  let yesScale1 = 1;
  let yesScale3 = 1;
  let noAttempts1 = 0;
  let noAttempts3 = 0;
  let currentScreen = 'screen-start';

  /* ── navigate ── */
  window.goTo = (id) => {
    const prev = document.getElementById(currentScreen);
    const next = document.getElementById(id);
    if(!next || id === currentScreen) return;

    prev.classList.remove('active');
    next.classList.add('active');
    currentScreen = id;

    if(id === 'screen-final'){
      document.body.classList.remove('bg-default');
      document.body.classList.add('bg-final');
      startHeartsRain();
    }

    /* reset floating NO buttons */
    resetNo(1);
    resetNo(3);
  };

  /* ── run-away NO button ── */
  window.runAway = (q, e) => {
    e.preventDefault();
    e.stopPropagation();

    const noBtn = document.getElementById('no' + q);
    const yesBtn = document.getElementById('yes' + q);
    const card = document.getElementById('card-q' + q);

    /* make NO float absolute inside screen */
    const screen = document.getElementById('screen-q' + q);
    const rect = screen.getBoundingClientRect();

    /* detach from card, attach to screen */
    if(!noBtn.classList.contains('btn-no-floating')){
      noBtn.classList.add('btn-no-floating');
      screen.appendChild(noBtn);
    }

    /* random position within safe bounds */
    const pad = 20;
    const btnW = noBtn.offsetWidth;
    const btnH = noBtn.offsetHeight;
    const maxX = rect.width - btnW - pad;
    const maxY = rect.height - btnH - pad;
    const x = Math.max(pad, Math.random() * maxX);
    const y = Math.max(pad, Math.random() * maxY);

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    /* grow YES */
    if(q === 1){
      noAttempts1++;
      yesScale1 = 1 + noAttempts1 * 0.15;
      yesBtn.style.transform = 'scale(' + yesScale1 + ')';
      yesBtn.style.zIndex = '30';
    } else {
      noAttempts3++;
      yesScale3 = 1 + noAttempts3 * 0.15;
      yesBtn.style.transform = 'scale(' + yesScale3 + ')';
      yesBtn.style.zIndex = '30';
    }

    /* shake card */
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  };

  function resetNo(q){
    const noBtn = document.getElementById('no' + q);
    if(noBtn && noBtn.classList.contains('btn-no-floating')){
      noBtn.classList.remove('btn-no-floating');
      noBtn.style.left = '';
      noBtn.style.top = '';
      const row = document.querySelector('#card-q' + q + ' .btn-row');
      if(row) row.appendChild(noBtn);
    }
  }

  /* ── submit textarea ── */
  window.submitText = () => {
    const inputDiv = document.getElementById('q2-input');
    const replaced = document.getElementById('replacedText');

    inputDiv.style.display = 'none';
    replaced.textContent = '"eu acho o henrique muito lindo e eu quero muito ele, pq ele e muito gato vey juro" 😏';
    replaced.classList.add('show');

    setTimeout(() => goTo('screen-q3'), 2200);
  };

  /* ── hearts rain ── */
  function startHeartsRain(){
    const container = document.getElementById('heartsContainer');
    const hearts = ['❤️','💕','💖','💗','💓','💘','💝','🩷'];

    function spawnHeart(){
      const el = document.createElement('span');
      el.className = 'floating-heart';
      el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      el.style.left = Math.random() * 100 + '%';
      el.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
      const dur = 3 + Math.random() * 4;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = '0s';
      container.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 100);
    }

    /* initial burst */
    for(let i = 0; i < 15; i++) setTimeout(spawnHeart, i * 120);

    /* continuous */
    setInterval(spawnHeart, 400);
  }

})();
</script>
</body>
</html>
